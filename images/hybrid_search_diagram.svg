<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 692" width="1000" height="692" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
<rect width="1000" height="692" fill="#ffffff"/>
<text x="500.0" y="32" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Hybrid Search RAG: meaning + exact words, step by step</text>
<rect x="10" y="50" width="980" height="286" rx="16" fill="#f5f9ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="28" y="78" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="start" font-style="normal">PART 1 · INDEXING  (done once)</text>
<rect x="28" y="156" width="140" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<circle cx="28" cy="156" r="13" fill="#2563eb"/>
<text x="28" y="161" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">1</text>
<text x="98.0" y="183" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Documents</text>
<text x="98.0" y="203" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">your texts, PDFs,</text>
<text x="98.0" y="218" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">web pages</text>
<text x="98.0" y="236" font-size="10.5" font-weight="normal" fill="#1d4ed8" text-anchor="middle" font-style="italic">data we add:</text>
<text x="98.0" y="249" font-size="10.5" font-weight="normal" fill="#1d4ed8" text-anchor="middle" font-style="italic">3 demo sentences</text>
<rect x="192" y="156" width="140" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<circle cx="192" cy="156" r="13" fill="#2563eb"/>
<text x="192" y="161" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">2</text>
<text x="262.0" y="183" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Split into chunks</text>
<text x="262.0" y="203" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">cut long text into</text>
<text x="262.0" y="218" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">small pieces</text>
<text x="262.0" y="236" font-size="10.5" font-weight="normal" fill="#1d4ed8" text-anchor="middle" font-style="italic">(our demo sentences</text>
<text x="262.0" y="249" font-size="10.5" font-weight="normal" fill="#1d4ed8" text-anchor="middle" font-style="italic">are already small)</text>
<rect x="356" y="96" width="140" height="100" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<circle cx="356" cy="96" r="13" fill="#4f46e5"/>
<text x="356" y="101" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">3a</text>
<text x="426.0" y="123" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Dense encoder</text>
<text x="426.0" y="143" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">makes a vector that</text>
<text x="426.0" y="158" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">captures the MEANING</text>
<text x="426.0" y="176" font-size="10.5" font-weight="normal" fill="#4338ca" text-anchor="middle" font-style="italic">HuggingFaceEmbeddings</text>
<text x="426.0" y="189" font-size="10.5" font-weight="normal" fill="#4338ca" text-anchor="middle" font-style="italic">all-MiniLM-L6-v2</text>
<rect x="356" y="216" width="140" height="100" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<circle cx="356" cy="216" r="13" fill="#db2777"/>
<text x="356" y="221" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">3b</text>
<text x="426.0" y="243" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Sparse encoder</text>
<text x="426.0" y="263" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">scores the exact</text>
<text x="426.0" y="278" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">KEYWORDS (BM25)</text>
<text x="426.0" y="296" font-size="10.5" font-weight="normal" fill="#be185d" text-anchor="middle" font-style="italic">BM25Encoder</text>
<text x="426.0" y="309" font-size="10.5" font-weight="normal" fill="#be185d" text-anchor="middle" font-style="italic">(pinecone-text)</text>
<rect x="520" y="96" width="140" height="100" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="590.0" y="123" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Dense vector</text>
<text x="590.0" y="143" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">384 numbers</text>
<text x="590.0" y="158" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">[0.12, -0.50, 0.88 ...]</text>
<text x="590.0" y="176" font-size="10.5" font-weight="normal" fill="#4338ca" text-anchor="middle" font-style="italic">finds similar meaning</text>
<rect x="520" y="216" width="140" height="100" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="2"/>
<text x="590.0" y="243" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Sparse vector</text>
<text x="590.0" y="263" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">a score per keyword</text>
<text x="590.0" y="278" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">e.g. {2021: 1.8, Paris: 1.3}</text>
<text x="590.0" y="296" font-size="10.5" font-weight="normal" fill="#be185d" text-anchor="middle" font-style="italic">finds exact words</text>
<path d="M684,168 a70.0,12 0 0 1 140,0 v76 a70.0,12 0 0 1 -140,0 z" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<ellipse cx="754.0" cy="168" rx="70.0" ry="12" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
<circle cx="684" cy="156" r="13" fill="#ea580c"/>
<text x="684" y="161" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">4</text>
<text x="754.0" y="202" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Pinecone index</text>
<text x="754.0" y="219" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">BOTH vectors of</text>
<text x="754.0" y="233" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">every chunk</text>
<text x="754.0" y="255" font-size="10.5" font-weight="normal" fill="#c2410c" text-anchor="middle" font-style="italic">metric = dotproduct</text>
<line x1="170" y1="206.0" x2="190" y2="206.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="334" y1="192.0" x2="354" y2="146.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="334" y1="220.0" x2="354" y2="266.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="498" y1="146.0" x2="518" y2="146.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="498" y1="266.0" x2="518" y2="266.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="662" y1="146.0" x2="682" y2="192.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="662" y1="266.0" x2="682" y2="220.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<rect x="848" y="96" width="140" height="220" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="918.0" y="122" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-style="normal">Why two vectors?</text>
<text x="918.0" y="144" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">Dense finds text with</text>
<text x="918.0" y="159" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">a similar meaning, but</text>
<text x="918.0" y="174" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">can miss exact IDs,</text>
<text x="918.0" y="189" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">names and years.</text>
<text x="918.0" y="204" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal"></text>
<text x="918.0" y="219" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">Sparse finds the exact</text>
<text x="918.0" y="234" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">words, but misses</text>
<text x="918.0" y="249" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">different wording.</text>
<text x="918.0" y="264" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal"></text>
<text x="918.0" y="279" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">Together they cover</text>
<text x="918.0" y="294" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">both.</text>
<rect x="10" y="356" width="980" height="288" rx="16" fill="#f4fcf6" stroke="#16a34a" stroke-width="1.5"/>
<text x="28" y="384" font-size="14" font-weight="bold" fill="#15803d" text-anchor="start" font-style="normal">PART 2 · SEARCHING  (every question)</text>
<rect x="28" y="464" width="140" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<circle cx="28" cy="464" r="13" fill="#16a34a"/>
<text x="28" y="469" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">5</text>
<text x="98.0" y="491" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">User question</text>
<text x="98.0" y="511" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">"Which city did I</text>
<text x="98.0" y="526" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">visit in 2021?"</text>
<text x="98.0" y="544" font-size="10.5" font-weight="normal" fill="#15803d" text-anchor="middle" font-style="italic">the user types a</text>
<text x="98.0" y="557" font-size="10.5" font-weight="normal" fill="#15803d" text-anchor="middle" font-style="italic">question</text>
<rect x="192" y="404" width="140" height="100" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<circle cx="192" cy="404" r="13" fill="#4f46e5"/>
<text x="192" y="409" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">6a</text>
<text x="262.0" y="431" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Dense query vector</text>
<text x="262.0" y="451" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">same embedding model</text>
<text x="262.0" y="466" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">as in part 1</text>
<text x="262.0" y="484" font-size="10.5" font-weight="normal" fill="#4338ca" text-anchor="middle" font-style="italic">HuggingFaceEmbeddings</text>
<rect x="192" y="524" width="140" height="100" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<circle cx="192" cy="524" r="13" fill="#db2777"/>
<text x="192" y="529" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">6b</text>
<text x="262.0" y="551" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Sparse query vector</text>
<text x="262.0" y="571" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">same BM25 encoder</text>
<text x="262.0" y="586" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">as in part 1</text>
<text x="262.0" y="604" font-size="10.5" font-weight="normal" fill="#be185d" text-anchor="middle" font-style="italic">BM25Encoder</text>
<rect x="356" y="464" width="140" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<circle cx="356" cy="464" r="13" fill="#ea580c"/>
<text x="356" y="469" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">7</text>
<text x="426.0" y="491" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Hybrid search</text>
<text x="426.0" y="511" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">dense score x alpha</text>
<text x="426.0" y="526" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">+ sparse score x (1-alpha)</text>
<text x="426.0" y="544" font-size="10.5" font-weight="normal" fill="#c2410c" text-anchor="middle" font-style="italic">PineconeHybrid</text>
<text x="426.0" y="557" font-size="10.5" font-weight="normal" fill="#c2410c" text-anchor="middle" font-style="italic">SearchRetriever</text>
<rect x="520" y="464" width="140" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<circle cx="520" cy="464" r="13" fill="#16a34a"/>
<text x="520" y="469" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">8</text>
<text x="590.0" y="491" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Top chunks</text>
<text x="590.0" y="511" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">the best matching</text>
<text x="590.0" y="526" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">texts, best first</text>
<text x="590.0" y="544" font-size="10.5" font-weight="normal" fill="#15803d" text-anchor="middle" font-style="italic">"In 2021, I visited</text>
<text x="590.0" y="557" font-size="10.5" font-weight="normal" fill="#15803d" text-anchor="middle" font-style="italic">New Orleans"</text>
<rect x="684" y="464" width="140" height="100" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="684" cy="464" r="13" fill="#6b7280"/>
<text x="684" y="469" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">9</text>
<text x="754.0" y="491" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Prompt + LLM</text>
<text x="754.0" y="511" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">question + chunks go</text>
<text x="754.0" y="526" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">to the LLM</text>
<text x="754.0" y="544" font-size="10.5" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="italic">(same as Simple RAG)</text>
<rect x="848" y="464" width="140" height="100" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="848" cy="464" r="13" fill="#6b7280"/>
<text x="848" y="469" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">10</text>
<text x="918.0" y="491" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Answer</text>
<text x="918.0" y="511" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">written by the LLM,</text>
<text x="918.0" y="526" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">shown to the user</text>
<line x1="170" y1="500.0" x2="190" y2="454.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="170" y1="528.0" x2="190" y2="574.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="334" y1="454.0" x2="354" y2="500.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="334" y1="574.0" x2="354" y2="528.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="498" y1="514.0" x2="518" y2="514.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="662" y1="514.0" x2="682" y2="514.0" stroke="#111827" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<line x1="826" y1="514.0" x2="846" y2="514.0" stroke="#111827" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="836.0" y="590" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">dashed = not in our notebook yet,</text>
<text x="836.0" y="605" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">add the Simple RAG prompt and LLM</text>
<path d="M754.0,256 V346 H426.0 V461" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="762.0" y="292" font-size="11" font-weight="normal" fill="#c2410c" text-anchor="start" font-style="normal">stored vectors</text>
<text x="762.0" y="307" font-size="11" font-weight="normal" fill="#c2410c" text-anchor="start" font-style="normal">are searched</text>
<rect x="10" y="664" width="16" height="16" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="34" y="677" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start" font-style="normal">Dense = meaning</text>
<rect x="190" y="664" width="16" height="16" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
<text x="214" y="677" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start" font-style="normal">Sparse = exact words</text>
<rect x="400" y="664" width="16" height="16" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="424" y="677" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start" font-style="normal">Pinecone: stores and searches both</text>
<rect x="700" y="664" width="16" height="16" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="724" y="677" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start" font-style="normal">Not in our notebook yet</text>
</svg>