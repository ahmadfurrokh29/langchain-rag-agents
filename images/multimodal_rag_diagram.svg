<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 702" width="1000" height="702" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
<rect width="1000" height="702" fill="#ffffff"/>
<text x="500.0" y="32" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Multimodal RAG: text + images, step by step</text>
<rect x="10" y="50" width="980" height="402" rx="16" fill="#f5f9ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="28" y="78" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="start" font-style="normal">PART 1 · INDEXING  (done once)</text>
<rect x="28" y="156" width="140" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<circle cx="28" cy="156" r="13" fill="#2563eb"/>
<text x="28" y="161" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">1</text>
<text x="98.0" y="183" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">PDF document</text>
<text x="98.0" y="203" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">text + images + charts</text>
<text x="98.0" y="236" font-size="10.5" font-weight="normal" fill="#1d4ed8" text-anchor="middle" font-style="italic">Nova_Labs_Annual_</text>
<text x="98.0" y="249" font-size="10.5" font-weight="normal" fill="#1d4ed8" text-anchor="middle" font-style="italic">Report_2025.pdf</text>
<rect x="192" y="156" width="140" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<circle cx="192" cy="156" r="13" fill="#2563eb"/>
<text x="192" y="161" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">2</text>
<text x="262.0" y="183" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Extract</text>
<text x="262.0" y="203" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">pull out the text and</text>
<text x="262.0" y="218" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">the images of each page</text>
<text x="262.0" y="236" font-size="10.5" font-weight="normal" fill="#1d4ed8" text-anchor="middle" font-style="italic">PyMuPDF (fitz)</text>
<rect x="356" y="96" width="140" height="100" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<circle cx="356" cy="96" r="13" fill="#4f46e5"/>
<text x="356" y="101" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">3a</text>
<text x="426.0" y="123" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Split the text</text>
<text x="426.0" y="143" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">cut each page into</text>
<text x="426.0" y="158" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">small chunks</text>
<text x="426.0" y="176" font-size="10.5" font-weight="normal" fill="#4338ca" text-anchor="middle" font-style="italic">RecursiveCharacter</text>
<text x="426.0" y="189" font-size="10.5" font-weight="normal" fill="#4338ca" text-anchor="middle" font-style="italic">TextSplitter 500 / 100</text>
<rect x="356" y="216" width="140" height="100" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<circle cx="356" cy="216" r="13" fill="#db2777"/>
<text x="356" y="221" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">3b</text>
<text x="426.0" y="243" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Open each image</text>
<text x="426.0" y="263" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">convert it to a</text>
<text x="426.0" y="278" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">PIL image (RGB)</text>
<text x="426.0" y="296" font-size="10.5" font-weight="normal" fill="#be185d" text-anchor="middle" font-style="italic">doc.extract_image()</text>
<rect x="520" y="96" width="140" height="100" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<circle cx="520" cy="96" r="13" fill="#4f46e5"/>
<text x="520" y="101" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">4a</text>
<text x="590.0" y="123" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">CLIP text vector</text>
<text x="590.0" y="143" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">512 numbers per chunk</text>
<text x="590.0" y="158" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">(reads max 77 tokens)</text>
<text x="590.0" y="176" font-size="10.5" font-weight="normal" fill="#4338ca" text-anchor="middle" font-style="italic">embed_text()</text>
<rect x="520" y="216" width="140" height="100" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<circle cx="520" cy="216" r="13" fill="#db2777"/>
<text x="520" y="221" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">4b</text>
<text x="590.0" y="243" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">CLIP image vector</text>
<text x="590.0" y="263" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">512 numbers per image</text>
<text x="590.0" y="278" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">same CLIP model</text>
<text x="590.0" y="296" font-size="10.5" font-weight="normal" fill="#be185d" text-anchor="middle" font-style="italic">embed_image()</text>
<rect x="520" y="336" width="140" height="100" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="2"/>
<circle cx="520" cy="336" r="13" fill="#db2777"/>
<text x="520" y="341" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">4c</text>
<text x="590.0" y="363" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">Base64 copy</text>
<text x="590.0" y="383" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">the image as text, to</text>
<text x="590.0" y="398" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">send to the LLM later</text>
<text x="590.0" y="416" font-size="10.5" font-weight="normal" fill="#be185d" text-anchor="middle" font-style="italic">image_data_storage</text>
<path d="M684,168 a70.0,12 0 0 1 140,0 v76 a70.0,12 0 0 1 -140,0 z" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<ellipse cx="754.0" cy="168" rx="70.0" ry="12" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
<circle cx="684" cy="156" r="13" fill="#ea580c"/>
<text x="684" y="161" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-style="normal">5</text>
<text x="754.0" y="202" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle" font-style="normal">FAISS store</text>
<text x="754.0" y="219" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">text + image vectors</text>
<text x="754.0" y="233" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="normal">+ metadata (type)</text>
<text x="754.0" y="255" font-size="10.5" font-weight="normal" fill="#c2410c" text-anchor="middle" font-style="italic">from_embeddings()</text>
<line x1="170" y1="206.0" x2="190" y2="206.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="334" y1="192.0" x2="354" y2="146.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="334" y1="220.0" x2="354" y2="266.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
<line x1="498" y1="146.0" x2="518" y2="146.0" stroke="#111827" stroke-width="2.3" marker-end="url(#ah)"/>
